name: 🧟‍♀️ Exotic Channel Renamer

on:
  workflow_dispatch:
    inputs:
      old_name:
        description: "Nom actuel exact de la chaîne dans la playlist"
        required: true
        type: string
      new_name:
        description: "Nouveau nom souhaité"
        required: true
        type: string
      new_url:
        description: "Nouvelle URL (laisser vide pour garder l'actuelle)"
        required: false
        type: string
        default: ""

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install deps
        run: pip install requests

      - name: 🧟‍♀️ Rename channel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_NAME: ${{ inputs.old_name }}
          NEW_NAME: ${{ inputs.new_name }}
          NEW_URL: ${{ inputs.new_url }}
        run: python scripts/rename_channel.py
